name: Validate IETF draft

on:
  push:
    branches: ["feat/ietf-reht-protocol-00"]
    paths:
      - "ietf/**"
      - ".github/workflows/validate-ietf.yml"
  pull_request:
    paths:
      - "ietf/**"
      - ".github/workflows/validate-ietf.yml"

permissions:
  contents: read

jobs:
  validate-ietf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install "pytest>=8,<9" xml2rfc
      - name: Run REHT conformance tests
        working-directory: ietf
        run: python -m pytest test_reht_conformance.py -q
      - name: Validate and render RFCXML v3
        working-directory: ietf
        run: |
          xml2rfc --text draft-solland-reht-protocol-00.xml
          xml2rfc --html draft-solland-reht-protocol-00.xml
      - name: Verify generated submission rendering
        working-directory: ietf
        run: |
          test -s draft-solland-reht-protocol-00.txt
          test -s draft-solland-reht-protocol-00.html
