name: Validate standard

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate JSON and schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for

          roots = [Path("schemas"), Path("contracts"), Path("conformance"), Path("examples")]
          files = sorted(p for root in roots if root.exists() for p in root.rglob("*.json"))
          if not files:
              raise SystemExit("No JSON artifacts found")

          for path in files:
              with path.open(encoding="utf-8") as fh:
                  data = json.load(fh)
              if path.parts[0] == "schemas" and isinstance(data, dict) and "$schema" in data:
                  validator_for(data).check_schema(data)
              print(f"validated {path}")
          PY
      - name: Validate credential-delivery interop profile (#5)
        run: |
          python tests/validate_credential_delivery.py
      - name: Verify required public files
        run: |
          test -f README.md
          test -f SPECIFICATION.md
          test -f CONFORMANCE.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f GOVERNANCE.md
          test -f LICENSE
          test -f NOTICE
          test -f TRADEMARKS.md
          test -f PUBLICATION_STATUS.md
          test -f docs/STATE_AND_CONTRACT_CONTINUITY.md
          test -f docs/CONSTRAINT_OBSERVABILITY_AND_ACTION_TRANSFORMATION.md
          test -f docs/VERIFICATION_EVIDENCE_BINDING.md
          test -f docs/CCS_RECEIPT_BINDING_CONVERGENCE.md
          test -f conformance/causal-execution-v0.5.json
      - name: Verify v0.5 version surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = "0.5.0-draft.1"
          spec = Path("SPECIFICATION.md").read_text(encoding="utf-8")
          conformance = Path("CONFORMANCE.md").read_text(encoding="utf-8")
          publication = Path("PUBLICATION_STATUS.md").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          vector = json.loads(Path("conformance/causal-execution-v0.5.json").read_text(encoding="utf-8"))
          if f"Version: {expected}" not in spec:
              raise SystemExit("SPECIFICATION.md version mismatch")
          if f"Version: {expected}" not in conformance:
              raise SystemExit("CONFORMANCE.md version mismatch")
          if expected not in publication:
              raise SystemExit("PUBLICATION_STATUS.md version mismatch")
          if expected not in readme:
              raise SystemExit("README.md version mismatch")
          if vector.get("version") != expected:
              raise SystemExit("v0.5 conformance vector version mismatch")
          PY
